<meta charset="UTF-8">
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>달빛카페 메뉴판</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: #FAFAFA;
      color: #222222;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 24px 16px;
    }
    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 3px solid #333333;
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      color: #111111;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
    }
    .menu-item {
      background-color: #FFFFFF;
      border: 2px solid #E0E0E0;
      border-radius: 16px;
      padding: 24px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
    .menu-name {
      font-size: 26px;
      font-weight: 700;
      color: #222222;
    }
    .menu-price {
      font-size: 26px;
      font-weight: 800;
      color: #D9534F;
    }
    footer {
      text-align: center;
      padding: 16px 0;
      font-size: 18px;
      color: #666666;
      border-top: 1px solid #DDDDDD;
    }
  </style>
</head>
<body>

  <header>
    <h1>달빛카페</h1>
  </header>

  <main>
    <div class="menu-item">
      <span class="menu-name">아메리카노</span>
      <span class="menu-price">3,500원</span>
    </div>
    <div class="menu-item">
      <span class="menu-name">카페라떼</span>
      <span class="menu-price">4,000원</span>
    </div>
    <div class="menu-item">
      <span class="menu-name">딸기케이크</span>
      <span class="menu-price">5,500원</span>
    </div>
  </main>

  <footer>
    <p>가상의 가게입니다</p>
  </footer>

</body>
</html>
